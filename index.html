<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gharkharch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a7">
<meta name="color-scheme" content="light dark">
<title>Gharkharch</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--fg:#1c1c1e;--mut:#6e6e73;--bd:#d1d1d6;--btn:#0a7;--red:#d00;--grn:#0a7}
  @media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f2f2f7;--mut:#98989d;--bd:#3a3a3c;--red:#ff453a;--grn:#30d158}}
  *{box-sizing:border-box}
  body{font-family:-apple-system,system-ui,sans-serif;max-width:480px;margin:0 auto;background:var(--bg);color:var(--fg);
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  input,select,button{font:inherit;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);min-height:44px}
  button{background:var(--btn);color:#fff;border:0;font-weight:600}
  .card{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-bottom:8px}
  .card b{font-size:2.6em;display:block}
  .card small{color:var(--mut);display:block;margin-top:4px}
  .neg{color:var(--red)}.pos{color:var(--grn)}
  #warn{background:var(--red);color:#fff;border-radius:10px;padding:8px;text-align:center;margin-bottom:8px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .full{grid-column:1/-1}
  #cats{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:8px 12px;min-height:36px;font-weight:400}
  .chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
  #cancel{background:var(--mut)}
  ul{list-style:none;padding:0;margin:0}
  li{background:var(--card);border-radius:10px;margin-bottom:6px;display:flex;align-items:center}
  li .row{flex:1;padding:12px;cursor:pointer}
  li small{color:var(--mut);display:block}
  li .del{background:none;color:var(--red);font-size:1.3em;width:48px}
  #err,#lerr{color:var(--red)}
  #brk{color:var(--mut);font-size:.9em;margin:8px 0;text-align:center}
  a{color:var(--mut)}
  input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0;flex:none;accent-color:var(--btn)}
  label.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer}
  .stats{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
  .stats div{flex:1;background:var(--bg);border-radius:10px;padding:8px 4px;color:var(--mut);font-size:.85em}
  .stats strong{display:block;color:var(--fg);font-size:1.15em}
  form{background:var(--card);padding:12px;border-radius:14px}
  input,select{width:100%;min-width:0}
  @media(min-width:600px){body{max-width:620px}.card b{font-size:3em}}
  #bar{position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,transparent,var(--btn),transparent);
    background-size:40% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:9}
  @keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
  body.busy #bar{opacity:1}
  body.busy{cursor:progress}
  body.busy #list,body.busy .card{opacity:.5;transition:opacity .15s}
  body.busy button{pointer-events:none}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);
    border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;z-index:10;max-width:calc(100% - 32px)}
  #toast button{padding:8px 14px;min-height:36px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
  #q{grid-column:1/-1}
  #fsum{color:var(--mut);font-size:.85em;margin:0 4px 6px}
  #brk{text-align:left;padding:12px 16px}
  .cr{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:.9em;margin:6px 0;cursor:pointer}
  .cr .t{background:var(--bd);border-radius:6px;height:10px;overflow:hidden}
  .cr i{display:block;height:100%;background:var(--btn);border-radius:6px}
  .cr i.over{background:var(--red)}
  li.day{background:none;display:flex;justify-content:space-between;color:var(--mut);font-size:.85em;margin:12px 4px 4px}
  li.empty{justify-content:center;padding:16px;color:var(--mut)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toast" hidden><span id="tmsg"></span><button id="undo">Undo</button></div>
<form id="login" hidden>
  <input class="full" type="password" id="pin" placeholder="PIN / password" required autocomplete="current-password">
  <button class="full">Unlock</button>
  <div class="full" id="lerr"></div>
</form>

<div id="app" hidden>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <button id="prev" aria-label="Previous month" style="width:52px;flex:none">◀</button>
    <input type="month" id="month" style="flex:1;text-align:center">
    <button id="next" aria-label="Next month" style="width:52px;flex:none">▶</button>
  </div>
  <div id="warn" hidden></div>
  <div class="card">Remaining<b id="bal">₹0</b>
    <div class="stats">
      <div>Income<strong>₹<span id="inc">0</span></strong></div>
      <div>Expense<strong>₹<span id="exp">0</span></strong></div>
      <div id="carrybox" hidden>Carried<strong>₹<span id="carryv">0</span></strong></div>
    </div>
    <small id="pace"></small>
  </div>
  <label class="chk"><input type="checkbox" id="cf"> Carry leftover from earlier months</label>

  <form id="f">
    <input type="date" id="date" required>
    <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
    <input type="number" id="amount" inputmode="decimal" placeholder="Amount ₹" min="0.01" step="any" required>
    <select id="who"></select>
    <div class="full" id="cats"></div>
    <input class="full" id="note" placeholder="Note (optional)" enterkeyhint="done">
    <button class="full" id="go">Add</button>
    <button type="button" class="full" id="cancel" hidden>Cancel edit</button>
  </form>
  <div id="err"></div>
  <div id="brk" class="card" hidden></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search note, category, name…" enterkeyhint="search">
    <select id="fwho"></select>
    <select id="fcat"></select>
  </div>
  <div id="fsum"></div>
  <ul id="list"></ul>
  <p style="text-align:center"><a href="#" id="csv">Export CSV</a> · <a href="#" id="lock">Lock</a></p>
</div>

<script>
const URL_ = "https://drcenfbvcenegefozzsi.supabase.co";
const KEY  = "sb_publishable_nM8K1MbZxXaU5r3lgFo98A_VQsTImE3";
const EMAIL = "satish29g1993@gmail.com"; // shared Supabase Auth user; PIN = its password
const NAMES = ["Satish", "Ankita"];       // edit to your real names
const CATS  = ["Groceries", "Vegetables", "Milk", "Fuel", "Medical", "Bills", "Other"];
const LOW   = 200;                       // warn when remaining drops below this
const BUDGETS = {Groceries: 3000, Vegetables: 1500, Milk: 1000, Fuel: 1000}; // monthly ₹ limits per category; edit/add/remove freely

const $ = id => document.getElementById(id);
const sum = rows => rows.reduce((a, r) => a + (r.type === "income" ? +r.amount : -r.amount), 0);
let busyN = 0; // loader: top bar + dimmed card/list + buttons locked while a user action is running
const spin = async f => {
  document.body.classList.add("busy"); busyN++;
  try { return await f(); } finally { if (!--busyN) document.body.classList.remove("busy"); }
};
let undoFn, toastT; // delete happens at once; the toast offers 6s to put it back
const toast = (msg, fn) => {
  $("tmsg").textContent = msg; undoFn = fn; $("toast").hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => $("toast").hidden = true, 6000);
};
$("undo").onclick = () => spin(async () => { $("toast").hidden = true; await undoFn(); await load(); });
let S = null, rows = [], editId = null, cat = CATS[0];
try { S = JSON.parse(localStorage.gk); } catch (e) {}

// --- iOS home-screen icon (drawn at runtime, no image file needed)
{ const c = document.createElement("canvas"); c.width = c.height = 180;
  const g = c.getContext("2d"); g.fillStyle = "#0a7"; g.fillRect(0, 0, 180, 180);
  g.fillStyle = "#fff"; g.font = "bold 120px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("₹", 90, 95);
  const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL(); document.head.append(l); }

// --- auth (PIN = password of shared Supabase user)
async function auth(grant, body) {
  const r = await fetch(URL_ + "/auth/v1/token?grant_type=" + grant, {method: "POST",
    headers: {apikey: KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  S = {access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + j.expires_in * 1000};
  localStorage.gk = JSON.stringify(S);
}
const show = on => { $("app").hidden = !on; $("login").hidden = on; };
const logout = () => { S = null; delete localStorage.gk; show(false); };
$("lock").onclick = e => { e.preventDefault(); logout(); };
$("login").onsubmit = async e => {
  e.preventDefault();
  try { await spin(() => auth("password", {email: EMAIL, password: $("pin").value})); $("pin").value = ""; $("lerr").textContent = ""; show(true); spin(load); }
  catch (e) { $("lerr").textContent = "Wrong PIN"; }
};

async function api(path, opt = {}, table = "entries") {
  if (S.exp - Date.now() < 60000) await auth("refresh_token", {refresh_token: S.refresh_token});
  const r = await fetch(URL_ + "/rest/v1/" + table + path, {...opt, headers: {apikey: KEY,
    Authorization: "Bearer " + S.access_token, "Content-Type": "application/json", ...opt.headers}});
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 ? null : r.text().then(t => t && JSON.parse(t));
}

// --- form setup
$("who").replaceChildren(...NAMES.map(n => new Option(n)));
$("who").value = NAMES[1];
const today = new Date().toLocaleDateString("sv"); // local date (toISOString is UTC: wrong in IST)
$("date").value = today;
$("month").value = today.slice(0, 7);
$("month").onchange = () => $("month").value && spin(load);
const shift = n => { // move month by n (Date handles year rollover)
  const [y, m] = $("month").value.split("-").map(Number), d = new Date(y, m - 1 + n, 1);
  $("month").value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; spin(load);
};
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
// carry toggle lives in the `settings` table so both phones agree
$("cf").onchange = () => spin(async () => {
  try { await api("", {method: "POST", headers: {Prefer: "resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify({key: "carry", value: $("cf").checked ? "1" : "0"})}, "settings"); }
  catch (e) { $("err").textContent = "Could not save setting: " + e.message + " (did you run the settings SQL?)"; }
  await load();
});

function drawCats() {
  $("cats").replaceChildren(...CATS.map(c => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = c; b.className = "chip" + (c === cat ? " on" : "");
    b.onclick = () => { cat = c; drawCats(); };
    return b;
  }));
}
drawCats();
$("type").onchange = () => $("cats").hidden = $("type").value === "income";

function resetForm() {
  editId = null; $("go").textContent = "Add"; $("cancel").hidden = true;
  $("amount").value = ""; $("note").value = ""; $("date").value = today;
}
$("cancel").onclick = resetForm;

function startEdit(r) {
  editId = r.id;
  if (![...$("who").options].some(o => o.value === r.who)) $("who").add(new Option(r.who));
  $("date").value = r.date; $("type").value = r.type; $("amount").value = r.amount;
  $("who").value = r.who; $("note").value = r.note || "";
  if (r.category) { cat = r.category; drawCats(); }
  $("cats").hidden = r.type === "income";
  $("go").textContent = "Save changes"; $("cancel").hidden = false;
  scrollTo(0, 0);
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const body = JSON.stringify({date: $("date").value, type: $("type").value, amount: +$("amount").value,
    who: $("who").value, note: $("note").value.trim(), category: $("type").value === "expense" ? cat : null});
  try {
    await spin(async () => {
      await (editId ? api("?id=eq." + editId, {method: "PATCH", headers: {Prefer: "return=minimal"}, body})
                    : api("", {method: "POST", headers: {Prefer: "return=minimal"}, body}));
      resetForm(); await load();
    });
  } catch (e) { $("err").textContent = "Save failed: " + e.message + " (did you run the category SQL?)"; }
};

// --- load + render
async function load() {
  try {
    const [s] = await api("?key=eq.carry", {}, "settings"); $("cf").checked = s?.value === "1";
    const m = $("month").value, [y, mo] = m.split("-").map(Number);
    const start = m + "-01", next = mo === 12 ? `${y + 1}-01-01` : `${y}-${String(mo + 1).padStart(2, "0")}-01`;
    rows = await api(`?select=*&date=gte.${start}&date=lt.${next}&order=date.desc,id.desc`);
    // ponytail: server caps responses at 1000 rows; carry would undercount past that. Fix: store monthly totals.
    const carry = $("cf").checked ? sum(await api(`?select=type,amount&date=lt.${start}`)) : 0;

    let inc = 0, exp = 0; const by = {};
    for (const r of rows) {
      if (r.type === "income") inc += +r.amount;
      else { exp += +r.amount; const c = r.category || "Other"; by[c] = (by[c] || 0) + +r.amount; }
    }
    const bal = carry + inc - exp;
    $("inc").textContent = inc; $("exp").textContent = exp;
    $("bal").textContent = "₹" + bal; $("bal").className = bal < 0 ? "neg" : "pos";
    $("carrybox").hidden = !$("cf").checked; $("carryv").textContent = carry;
    $("warn").hidden = bal >= LOW; $("warn").textContent = `⚠ Low balance (under ₹${LOW})`;

    const days = new Date(y, mo, 0).getDate(), cur = m === today.slice(0, 7);
    const dayNo = cur ? +today.slice(8) : days, left = days - dayNo + 1;
    $("pace").textContent = `Spending ₹${Math.round(exp / dayNo)}/day` +
      (cur && bal > 0 ? ` · ₹${Math.floor(bal / left)}/day for ${left} days left` : "");
    drawBrk(by); render();
    $("err").textContent = "";
  } catch (e) {
    if (["400", "401", "403"].includes(e.message)) return logout(); // expired session / failed refresh
    $("err").textContent = "Load failed: " + e.message;
  }
}

// category bars; bar = spent vs budget (red when over), or vs biggest category if no budget. Tap a row to filter.
function drawBrk(by) {
  const names = [...new Set([...Object.keys(by), ...Object.keys(BUDGETS)])].sort((a, b) => (by[b] || 0) - (by[a] || 0));
  const max = Math.max(...names.map(c => by[c] || 0), 1);
  $("brk").hidden = !names.length;
  $("brk").replaceChildren(...names.map(c => {
    const v = by[c] || 0, b = BUDGETS[c], row = document.createElement("div"), t = document.createElement("div"),
      i = document.createElement("i"), l = document.createElement("span"), a = document.createElement("span");
    row.className = "cr"; t.className = "t"; t.append(i);
    i.style.width = Math.min(100, v / (b || max) * 100) + "%"; if (b && v > b) i.className = "over";
    l.textContent = c; a.textContent = "₹" + v + (b ? " / ₹" + b : "");
    row.append(l, t, a); row.onclick = () => { $("fcat").value = c; render(); };
    return row;
  }));
}

const dayLabel = d => d === today ? "Today" : d === new Date(Date.now() - 864e5).toLocaleDateString("sv") ? "Yesterday"
  : new Date(d + "T00:00").toLocaleDateString("en-IN", {weekday: "short", day: "numeric", month: "short"});

function render() { // list only: filters apply here, month totals above stay for the whole month
  const q = $("q").value.trim().toLowerCase(), fw = $("fwho").value, fc = $("fcat").value;
  const shown = rows.filter(r => (!fw || r.who === fw) && (!fc || (r.type === "expense" && (r.category || "Other") === fc)) &&
    (!q || [r.note, r.category, r.who, r.amount].join(" ").toLowerCase().includes(q)));
  const dayExp = {}; let e = 0, i = 0;
  for (const r of shown) r.type === "expense" ? (e += +r.amount, dayExp[r.date] = (dayExp[r.date] || 0) + +r.amount) : i += +r.amount;
  $("fsum").textContent = q || fw || fc ? `${shown.length} shown · spent ₹${e}` + (i ? ` · income ₹${i}` : "") : "";

  const out = []; let last;
  for (const r of shown) {
    if (r.date !== last) {
      last = r.date; const h = document.createElement("li"); h.className = "day"; h.append(dayLabel(r.date));
      if (dayExp[r.date]) { const s = document.createElement("span"); s.textContent = "−₹" + dayExp[r.date]; h.append(s); }
      out.push(h);
    }
    const li = document.createElement("li"), d = document.createElement("div"), s = document.createElement("small"), inc = r.type === "income";
    d.className = "row"; d.onclick = () => startEdit(r);
    d.textContent = (inc ? "+" : "−") + "₹" + r.amount + "  " + (r.note || (inc ? "" : r.category || ""));
    if (inc) d.classList.add("pos");
    s.textContent = [r.who, !inc && r.note && r.category].filter(Boolean).join(" · ");
    d.append(s);
    const b = document.createElement("button");
    b.className = "del"; b.textContent = "✕"; b.setAttribute("aria-label", "Delete");
    b.onclick = async () => {
      await spin(async () => { await api("?id=eq." + r.id, {method: "DELETE"}); await load(); });
      toast(`Deleted ₹${r.amount} ${r.note || r.category || ""}`, () => api("", {method: "POST", headers: {Prefer: "return=minimal"},
        body: JSON.stringify({date: r.date, type: r.type, amount: r.amount, who: r.who, note: r.note, category: r.category})}));
    };
    li.append(d, b); out.push(li);
  }
  if (!shown.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "No entries"; out.push(li); }
  $("list").replaceChildren(...out);
}
$("fwho").replaceChildren(new Option("Everyone", ""), ...NAMES.map(n => new Option(n)));
$("fcat").replaceChildren(new Option("All categories", ""), ...CATS.map(c => new Option(c)));
$("q").oninput = $("fwho").onchange = $("fcat").onchange = render;

$("csv").onclick = e => {
  e.preventDefault();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "date,type,amount,who,category,note\n" + rows.map(r => [r.date, r.type, r.amount, r.who, r.category, r.note].map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = `gharkharch-${$("month").value}.csv`; a.click();
};

if (S) { show(true); spin(load); } else show(false);
setInterval(() => S && !editId && load(), 30000); // pick up the other person's entries
</script>
</body>
</html>
