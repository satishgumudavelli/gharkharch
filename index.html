<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gharkharch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a7">
<meta name="color-scheme" content="light dark">
<title>Gharkharch</title>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--fg:#1c1c1e;--mut:#6e6e73;--bd:#d1d1d6;--btn:#0a7;--red:#d00;--grn:#0a7}
  @media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f2f2f7;--mut:#98989d;--bd:#3a3a3c;--red:#ff453a;--grn:#30d158}}
  *{box-sizing:border-box}
  body{font-family:-apple-system,system-ui,sans-serif;max-width:480px;margin:0 auto;background:var(--bg);color:var(--fg);
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  body.big{zoom:1.2}
  input,select,button{font:inherit;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);min-height:44px}
  input,select{width:100%;min-width:0}
  button{background:var(--btn);color:#fff;border:0;font-weight:600}
  a{color:var(--mut)}
  .card{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-bottom:8px}
  .card b{font-size:2.6em;display:block}
  .card small{color:var(--mut);display:block;margin-top:4px}
  .neg{color:var(--red)}.pos{color:var(--grn)}
  #warn,#pend{background:var(--red);color:#fff;border-radius:10px;padding:8px;text-align:center;margin-bottom:8px}
  #pend{background:#b36b00}
  #nudge{background:var(--card);border:1px solid var(--btn);border-radius:10px;padding:8px;text-align:center;margin-bottom:8px}
  input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0;flex:none;accent-color:var(--btn)}
  label.chk{display:flex;align-items:center;gap:10px;padding:4px 2px;cursor:pointer}
  #hist{margin-top:10px;font-size:.85em;color:var(--mut);line-height:1.5}
  #hist div{border-top:1px solid var(--bd);padding:4px 0}
  .stats{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
  .stats div{flex:1;background:var(--bg);border-radius:10px;padding:8px 4px;color:var(--mut);font-size:.85em}
  .stats strong{display:block;color:var(--fg);font-size:1.15em}
  .chip{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:8px 12px;min-height:36px;font-weight:400}
  .chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
  #quick{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  #quick .chip{flex:none;white-space:nowrap}
  #brk{text-align:left;padding:12px 16px}
  .cr{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:.9em;margin:6px 0;cursor:pointer}
  .cr .t{background:var(--bd);border-radius:6px;height:10px;overflow:hidden}
  .cr i{display:block;height:100%;background:var(--btn);border-radius:6px}
  .cr i.over{background:var(--red)}
  summary{cursor:pointer;color:var(--mut);padding:8px 4px}
  label.bg{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin:6px 0}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
  #q{grid-column:1/-1}
  #fsum{color:var(--mut);font-size:.85em;margin:0 4px 6px}
  ul{list-style:none;padding:0;margin:0}
  li{background:var(--card);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;overflow:hidden}
  li.swiping{background:var(--red)}
  li .row,li .del{background:var(--card);transition:transform .15s}
  li .row{flex:1;padding:12px;cursor:pointer}
  li small{color:var(--mut);display:block}
  li .del{color:var(--red);font-size:1.3em;width:48px;align-self:stretch}
  li.day{background:none;display:flex;justify-content:space-between;color:var(--mut);font-size:.85em;margin:12px 4px 4px}
  li.empty{justify-content:center;padding:20px;color:var(--mut);text-align:center}
  #err,#lerr{color:var(--red)}
  /* add/edit sheet */
  #fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:60px;height:60px;
    border-radius:30px;font-size:2em;line-height:1;padding:0;box-shadow:0 4px 14px #0006;z-index:5}
  #ov{position:fixed;inset:0;background:#0007;z-index:20}
  #sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-width:480px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;
    padding:16px 16px max(16px,env(safe-area-inset-bottom));z-index:21;max-height:calc(var(--vh,100vh) - 16px);overflow:auto;
    transform:translateY(100%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
  #sheet.open{transform:none;visibility:visible;transition:transform .2s,visibility 0s}
  #sheet.qm #type,#sheet.qm #who,#sheet.qm #dlink,#sheet.qm #qlabel{display:none}
  .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.1em}
  form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);padding:12px;border-radius:14px}
  .full{grid-column:1/-1}
  #amount{font-size:24px;font-weight:600}
  #dlink{padding:4px 2px}
  /* loader */
  #bar{position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,transparent,var(--btn),transparent);
    background-size:40% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:40}
  @keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
  body.busy #bar{opacity:1}
  body.busy{cursor:progress}
  body.busy #list,body.busy .card{opacity:.5;transition:opacity .15s}
  body.busy button{pointer-events:none}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 70px);background:var(--fg);color:var(--bg);
    border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:30;max-width:calc(100% - 32px)}
  #toast button{padding:8px 14px;min-height:36px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toast" hidden><span id="tmsg"></span><button id="undo">Undo</button></div>
<form id="login" hidden>
  <input class="full" type="password" id="pin" placeholder="PIN / password" required autocomplete="current-password">
  <button class="full">Unlock</button>
  <div class="full" id="lerr"></div>
</form>

<div id="app" hidden>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <button id="prev" aria-label="Previous month" style="width:52px;flex:none">◀</button>
    <input type="month" id="month" style="flex:1;text-align:center">
    <button id="next" aria-label="Next month" style="width:52px;flex:none">▶</button>
  </div>
  <div id="warn" hidden></div>
  <div id="pend" hidden></div>
  <div id="nudge" hidden>📝 Nothing logged today yet. Tap + to add.</div>
  <div class="card">Remaining<b id="bal">₹0</b>
    <div class="stats">
      <div>Income<strong>₹<span id="inc">0</span></strong></div>
      <div>Expense<strong>₹<span id="exp">0</span></strong></div>
      <div>Carried<strong>₹<span id="carryv">0</span></strong></div>
    </div>
    <small id="pace"></small>
    <small id="people"></small>
  </div>
  <div id="quick" hidden></div>
  <div id="err"></div>
  <div id="brk" class="card" hidden></div>
  <details id="bd"><summary>Edit budgets</summary>
    <div id="bgrid"></div>
    <button id="bsave" type="button" style="width:100%;margin-top:8px">Save budgets</button>
  </details>
  <div class="filters">
    <input id="q" type="search" placeholder="Search note, category, name…" enterkeyhint="search">
    <select id="fwho"></select>
    <select id="fcat"></select>
  </div>
  <div id="fsum"></div>
  <ul id="list"></ul>
  <p style="text-align:center;line-height:2"><a href="#" id="share">Share summary</a> · <a href="#" id="remind">Daily reminder</a> · <a href="#" id="csv">Export CSV</a><br>
    <a href="#" id="big">A+ Bigger text</a> · <a href="#" id="lock">Lock</a></p>

  <button id="fab" aria-label="Add entry">+</button>
  <div id="ov" hidden></div>
  <div id="sheet" role="dialog" aria-label="Add entry">
    <div class="sh"><b id="stitle">Add entry</b><button type="button" id="sclose" class="chip" aria-label="Close">✕</button></div>
    <form id="f">
      <input class="full" type="number" id="amount" inputmode="decimal" placeholder="Amount ₹" min="0.01" step="any" required>
      <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      <select id="who"></select>
      <select class="full" id="cat" aria-label="Category"></select>
      <input class="full" id="note" placeholder="Note (optional)" enterkeyhint="done">
      <a href="#" class="full" id="dlink">📅 Today · change date</a>
      <input class="full" type="date" id="date" required hidden>
      <label class="full chk" id="qlabel"><input type="checkbox" id="qsave"> ⭐ Also add as a quick-add button</label>
      <button class="full" id="go">Add</button>
    </form>
    <div id="hist" hidden></div>
  </div>
</div>

<script>
const URL_ = "https://drcenfbvcenegefozzsi.supabase.co";
const KEY  = "sb_publishable_nM8K1MbZxXaU5r3lgFo98A_VQsTImE3";
const EMAIL = "satish29g1993@gmail.com"; // shared Supabase Auth user; PIN = its password
const NAMES = ["Satish", "Ankita"];       // edit to your real names
const CATS  = ["Groceries", "Vegetables", "Milk", "Fuel", "Medical", "Bills", "Other"];
const LOW   = 200;                       // warn when remaining drops below this
const REMIND_HOUR = 20;                  // 8pm: daily reminder time, and when the "nothing logged today" nudge starts
let budgets = {}; // category -> monthly ₹ limit, loaded from the `budgets` table

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("en-IN", {maximumFractionDigits: 2}); // 1,00,000 style
const errMsg = e => e instanceof TypeError || !navigator.onLine ? "No internet. Check your connection and try again."
  : `Something went wrong (${e.message}). Please try again.`;

// loader: top bar + dimmed card/list + buttons locked while a user action is running
let busyN = 0;
const spin = async f => {
  document.body.classList.add("busy"); busyN++;
  try { return await f(); } finally { if (!--busyN) document.body.classList.remove("busy"); }
};

// toast with optional Undo
let undoFn, toastT;
const toast = (msg, fn) => {
  $("tmsg").textContent = msg; undoFn = fn; $("undo").hidden = !fn; $("toast").hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => $("toast").hidden = true, 6000);
};
$("undo").onclick = () => spin(async () => { $("toast").hidden = true; try { await undoFn(); await load(); } catch (e) { toast(errMsg(e)); } });

// haptics: Android vibrates; iOS 17.4+ ticks when a hidden switch input is toggled (best effort)
const hap = document.createElement("label");
hap.style.cssText = "position:fixed;left:-99px;opacity:0;pointer-events:none";
hap.innerHTML = '<input type="checkbox" switch tabindex="-1">'; document.body.append(hap);
const buzz = () => { navigator.vibrate?.(15); hap.click(); };

// bigger text is a per-device choice, so it is the one setting kept on the phone
if (localStorage.big) document.body.classList.add("big");
$("big").onclick = e => { e.preventDefault(); localStorage.big = document.body.classList.toggle("big") ? "1" : ""; };

let S = null, rows = [], summary = null, editId = null, qEdit = false, qMode = false;

// keep the add sheet above the iOS keyboard instead of letting the page scroll its fields out of view
const vv = window.visualViewport;
const fit = () => {
  const r = document.documentElement.style;
  r.setProperty("--kb", Math.max(0, innerHeight - vv.height - vv.offsetTop) + "px");
  r.setProperty("--vh", vv.height + "px");
};
if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit(); }
try { S = JSON.parse(localStorage.gk); } catch (e) {}

// --- iOS home-screen icon (drawn at runtime, no image file needed)
{ const c = document.createElement("canvas"); c.width = c.height = 180;
  const g = c.getContext("2d"); g.fillStyle = "#0a7"; g.fillRect(0, 0, 180, 180);
  g.fillStyle = "#fff"; g.font = "bold 120px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("₹", 90, 95);
  const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL(); document.head.append(l); }

// --- auth (PIN = password of shared Supabase user)
async function auth(grant, body) {
  const r = await fetch(URL_ + "/auth/v1/token?grant_type=" + grant, {method: "POST",
    headers: {apikey: KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  S = {access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + j.expires_in * 1000};
  localStorage.gk = JSON.stringify(S);
}
const show = on => { $("app").hidden = !on; $("login").hidden = on; };
const logout = () => { S = null; delete localStorage.gk; show(false); };
$("lock").onclick = e => { e.preventDefault(); logout(); };
$("login").onsubmit = async e => {
  e.preventDefault();
  try { await spin(() => auth("password", {email: EMAIL, password: $("pin").value})); $("pin").value = ""; $("lerr").textContent = ""; show(true); spin(load); }
  catch (e) { $("lerr").textContent = e instanceof TypeError ? errMsg(e) : "Wrong PIN"; }
};

async function api(path, opt = {}, table = "entries") {
  if (S.exp - Date.now() < 60000) await auth("refresh_token", {refresh_token: S.refresh_token});
  const r = await fetch(URL_ + "/rest/v1/" + table + path, {...opt, headers: {apikey: KEY,
    Authorization: "Bearer " + S.access_token, "Content-Type": "application/json", ...opt.headers}});
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 ? null : r.text().then(t => t && JSON.parse(t));
}

// --- offline queue: new entries made without internet wait on the phone, then sync
// ponytail: if a POST succeeds but the reply is lost, the retry makes a duplicate; delete it by hand.
const Q = () => { try { return JSON.parse(localStorage.gq) || []; } catch (e) { return []; } };
const setQ = q => {
  q.length ? localStorage.gq = JSON.stringify(q) : delete localStorage.gq;
  $("pend").hidden = !q.length; $("pend").textContent = `⏳ ${q.length} ${q.length > 1 ? "entries" : "entry"} waiting for internet to sync`;
};
async function flushQ() {
  for (let q = Q(); q.length; q = Q()) {
    try { await api("", {method: "POST", headers: {Prefer: "return=minimal"}, body: JSON.stringify(q[0])}); }
    catch (e) { if (e instanceof TypeError || ["401", "403"].includes(e.message)) return; } // else: bad entry, drop it
    setQ(q.slice(1));
  }
}
async function addEntry(o) { // true = saved, false = queued offline
  try { await api("", {method: "POST", headers: {Prefer: "return=minimal"}, body: JSON.stringify(o)}); return true; }
  catch (e) { if (!(e instanceof TypeError)) throw e; setQ([...Q(), o]); return false; }
}
setQ(Q());
addEventListener("online", () => S && spin(load));

// --- month + form setup
$("who").replaceChildren(...NAMES.map(n => new Option(n)));
$("who").value = NAMES[1];
const today = new Date().toLocaleDateString("sv"); // local date (toISOString is UTC: wrong in IST)
$("month").value = today.slice(0, 7);
$("month").onchange = () => $("month").value && spin(load);
const shift = n => { // move month by n (Date handles year rollover)
  const [y, m] = $("month").value.split("-").map(Number), d = new Date(y, m - 1 + n, 1);
  $("month").value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; spin(load);
};
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);

$("cat").replaceChildren(...CATS.map(c => new Option(c)));
const syncType = () => { // income has no category; quick-add option only for new expenses
  $("cat").hidden = $("type").value === "income"; $("qlabel").hidden = $("cat").hidden || !!editId;
};
$("type").onchange = syncType;

// date row is hidden: entries default to today, "change date" reveals the picker
const showDate = on => { $("date").hidden = !on; $("dlink").hidden = on; };
$("dlink").onclick = e => { e.preventDefault(); showDate(true); $("date").focus(); };

function resetForm() {
  editId = null; qMode = false; $("sheet").classList.remove("qm");
  $("go").textContent = "Add"; $("stitle").textContent = "Add entry"; $("hist").hidden = true;
  $("amount").value = ""; $("note").value = ""; $("qsave").checked = false; $("date").value = today; showDate(false); syncType();
}
function openSheet() { $("ov").hidden = false; $("sheet").classList.add("open"); $("amount").focus(); } // amount focused: keypad opens at once
function closeSheet() { $("sheet").classList.remove("open"); $("ov").hidden = true; resetForm(); document.activeElement.blur(); }
$("fab").onclick = () => { resetForm(); openSheet(); };
$("sclose").onclick = $("ov").onclick = closeSheet;
addEventListener("keydown", e => e.key === "Escape" && closeSheet());

function startEdit(r) {
  editId = r.id;
  if (![...$("who").options].some(o => o.value === r.who)) $("who").add(new Option(r.who));
  $("date").value = r.date; $("type").value = r.type; $("amount").value = r.amount;
  $("who").value = r.who; $("note").value = r.note || ""; $("cat").value = r.category || "Other";
  syncType(); showDate(r.date !== today);
  $("go").textContent = "Save changes"; $("stitle").textContent = "Edit entry";
  openSheet(); showHist(r);
}

// edit history: when added, plus the old values saved by the DB trigger on every edit
const when = t => new Date(t).toLocaleString("en-IN", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"});
async function showHist(r) {
  const h = $("hist"); h.hidden = true;
  try {
    const log = await api(`?entry_id=eq.${r.id}&order=at.desc`, {}, "entry_log");
    if (editId !== r.id) return; // sheet moved on while loading
    const lines = log.map(l => `${when(l.at)}: was ₹${fmt(l.old.amount)} · ${l.old.who} · ${l.old.date}${l.old.category ? " · " + l.old.category : ""}${l.old.note ? " · " + l.old.note : ""}`);
    if (r.created_at) lines.push("Added " + when(r.created_at));
    h.replaceChildren(...(lines.length ? [Object.assign(document.createElement("b"), {textContent: "History"}), ...lines.map(t => Object.assign(document.createElement("div"), {textContent: t}))] : []));
    h.hidden = !lines.length;
  } catch (e) {}
}

$("f").onsubmit = async e => {
  e.preventDefault();
  if (qMode) { // save a quick-add button only
    try {
      await spin(async () => {
        await api("", {method: "POST", headers: {Prefer: "return=minimal"},
          body: JSON.stringify({note: $("note").value.trim(), category: $("cat").value, amount: +$("amount").value})}, "quick_adds");
        closeSheet(); buzz(); toast("Quick-add saved ✓"); await load();
      });
    } catch (e) { toast(errMsg(e)); }
    return;
  }
  const o = {date: $("date").value, type: $("type").value, amount: +$("amount").value,
    who: $("who").value, note: $("note").value.trim(), category: $("type").value === "expense" ? $("cat").value : null};
  try {
    await spin(async () => {
      let ok = true, qerr = false;
      if (editId) { await api("?id=eq." + editId, {method: "PATCH", headers: {Prefer: "return=minimal"}, body: JSON.stringify(o)}); closeSheet(); }
      else {
        ok = await addEntry(o);
        if (ok && $("qsave").checked && o.type === "expense") { // remember this entry as a one-tap button
          try { await api("", {method: "POST", headers: {Prefer: "return=minimal"},
            body: JSON.stringify({note: o.note, category: o.category, amount: o.amount})}, "quick_adds"); } catch (e) { qerr = true; }
        }
        $("amount").value = ""; $("note").value = ""; $("qsave").checked = false; $("amount").focus(); // stay open: add several in a row
      }
      buzz(); toast(!ok ? "Saved offline, will sync" : qerr ? "Saved ✓ but quick-add failed (run the quick_adds SQL)"
        : editId ? "Saved ✓" : "Saved ✓  add another, or close");
      if (ok) await load();
    });
  } catch (e) { toast(errMsg(e)); }
};

// --- delete (button or swipe left) with undo
async function del(r) {
  try {
    await spin(async () => { await api("?id=eq." + r.id, {method: "DELETE"}); await load(); });
    buzz();
    toast(`Deleted ₹${fmt(r.amount)} ${r.note || r.category || ""}`,
      () => addEntry({date: r.date, type: r.type, amount: r.amount, who: r.who, note: r.note, category: r.category}));
  } catch (e) { toast(errMsg(e)); }
}

// --- load + render
async function load() {
  try {
    await flushQ();
    const m = $("month").value, [y, mo] = m.split("-").map(Number);
    const start = m + "-01", next = mo === 12 ? `${y + 1}-01-01` : `${y}-${String(mo + 1).padStart(2, "0")}-01`;
    rows = await api(`?select=*&date=gte.${start}&date=lt.${next}&order=date.desc,id.desc`);
    // leftover from all earlier months, summed in the DB (carry_before function): no row cap
    const carry = +await api("/carry_before", {method: "POST", body: JSON.stringify({d: start})}, "rpc");
    budgets = Object.fromEntries((await api("?select=*", {}, "budgets")).map(x => [x.category, +x.amount]));
    const quick = await api("?select=*&order=id", {}, "quick_adds");

    let inc = 0, exp = 0; const by = {}, who = {};
    for (const r of rows) {
      if (r.type === "income") inc += +r.amount;
      else { exp += +r.amount; const c = r.category || "Other"; by[c] = (by[c] || 0) + +r.amount; who[r.who] = (who[r.who] || 0) + +r.amount; }
    }
    const bal = carry + inc - exp;
    $("inc").textContent = fmt(inc); $("exp").textContent = fmt(exp);
    $("bal").textContent = "₹" + fmt(bal); $("bal").className = bal < 0 ? "neg" : "pos";
    $("carryv").textContent = fmt(carry);
    $("people").textContent = exp ? "Spent by " + Object.entries(who).sort((a, b) => b[1] - a[1]).map(([n, v]) => `${n} ₹${fmt(v)}`).join(" · ") : "";
    $("warn").hidden = bal >= LOW; $("warn").textContent = `⚠ Low balance (under ₹${LOW})`;

    const days = new Date(y, mo, 0).getDate(), cur = m === today.slice(0, 7);
    const dayNo = cur ? +today.slice(8) : days, left = days - dayNo + 1;
    $("pace").textContent = `Spending ₹${fmt(Math.round(exp / dayNo))}/day` +
      (cur && bal > 0 ? ` · ₹${fmt(Math.floor(bal / left))}/day for ${left} days left` : "");
    summary = {m, inc, exp, carry, bal, by, who};
    $("nudge").hidden = !(cur && new Date().getHours() >= REMIND_HOUR && !rows.some(r => r.date === today));
    drawBrk(by); drawQuick(quick); render();
    $("err").textContent = "";
  } catch (e) {
    if (["400", "401", "403"].includes(e.message)) return logout(); // expired session / failed refresh
    $("err").textContent = errMsg(e);
  }
}

// quick-add buttons live in the `quick_adds` table. Tap one = saves that expense for today.
// "＋ New" creates one; "✎" switches to delete mode.
let quickList = [];
function drawQuick(list = quickList) {
  quickList = list;
  const chip = (text, fn, cls = "chip") => { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = fn; return b; };
  const items = list.map(q => {
    const label = `${q.note || q.category || "Other"} ₹${fmt(q.amount)}`;
    return qEdit
      ? chip("✕ " + label, () => spin(async () => { try { await api("?id=eq." + q.id, {method: "DELETE"}, "quick_adds"); await load(); } catch (e) { toast(errMsg(e)); } }))
      : chip(label, async () => {
        try {
          const ok = await spin(() => addEntry({date: today, type: "expense", amount: +q.amount, who: $("who").value, note: q.note || "", category: q.category}));
          buzz(); toast(ok ? `Saved ✓ ${label}` : "Saved offline, will sync");
          if (ok) spin(load);
        } catch (e) { toast(errMsg(e)); }
      });
  });
  $("quick").replaceChildren(...items,
    chip("＋ New", newQuick), ...(list.length ? [chip(qEdit ? "Done" : "✎", () => { qEdit = !qEdit; drawQuick(); })] : []));
  $("quick").hidden = false;
}
function newQuick() { // the sheet in "quick-add only" mode: amount, category, note; nothing is logged now
  resetForm(); qMode = true; $("sheet").classList.add("qm"); $("type").value = "expense"; syncType();
  $("stitle").textContent = "New quick-add"; $("go").textContent = "Save quick-add"; openSheet();
}

// category bars; bar = spent vs budget (red when over), or vs biggest category if no budget. Tap a row to filter.
function drawBrk(by) {
  const names = [...new Set([...Object.keys(by), ...Object.keys(budgets)])].sort((a, b) => (by[b] || 0) - (by[a] || 0));
  const max = Math.max(...names.map(c => by[c] || 0), 1);
  $("brk").hidden = !names.length;
  $("brk").replaceChildren(...names.map(c => {
    const v = by[c] || 0, b = budgets[c], row = document.createElement("div"), t = document.createElement("div"),
      i = document.createElement("i"), l = document.createElement("span"), a = document.createElement("span");
    row.className = "cr"; t.className = "t"; t.append(i);
    i.style.width = Math.min(100, v / (b || max) * 100) + "%"; if (b && v > b) i.className = "over";
    l.textContent = c; a.textContent = "₹" + fmt(v) + (b ? " / ₹" + fmt(b) : "");
    row.append(l, t, a); row.onclick = () => { $("fcat").value = c; render(); };
    return row;
  }));
}

const dayLabel = d => d === today ? "Today" : d === new Date(Date.now() - 864e5).toLocaleDateString("sv") ? "Yesterday"
  : new Date(d + "T00:00").toLocaleDateString("en-IN", {weekday: "short", day: "numeric", month: "short"});

function render() { // list only: filters apply here, month totals above stay for the whole month
  const q = $("q").value.trim().toLowerCase(), fw = $("fwho").value, fc = $("fcat").value, filtered = q || fw || fc;
  const shown = rows.filter(r => (!fw || r.who === fw) && (!fc || (r.type === "expense" && (r.category || "Other") === fc)) &&
    (!q || [r.note, r.category, r.who, r.amount].join(" ").toLowerCase().includes(q)));
  const dayExp = {}; let e = 0, i = 0;
  for (const r of shown) r.type === "expense" ? (e += +r.amount, dayExp[r.date] = (dayExp[r.date] || 0) + +r.amount) : i += +r.amount;
  $("fsum").textContent = filtered ? `${shown.length} shown · spent ₹${fmt(e)}` + (i ? ` · income ₹${fmt(i)}` : "") : "";

  const out = []; let last;
  for (const r of shown) {
    if (r.date !== last) {
      last = r.date; const h = document.createElement("li"); h.className = "day"; h.append(dayLabel(r.date));
      if (dayExp[r.date]) { const s = document.createElement("span"); s.textContent = "−₹" + fmt(dayExp[r.date]); h.append(s); }
      out.push(h);
    }
    const li = document.createElement("li"), d = document.createElement("div"), s = document.createElement("small"), inc = r.type === "income";
    d.className = "row"; d.onclick = () => startEdit(r);
    d.textContent = (inc ? "+" : "−") + "₹" + fmt(r.amount) + "  " + (r.note || (inc ? "" : r.category || ""));
    if (inc) d.classList.add("pos");
    s.textContent = [r.who, !inc && r.note && r.category].filter(Boolean).join(" · ");
    d.append(s);
    const b = document.createElement("button");
    b.className = "del"; b.textContent = "✕"; b.setAttribute("aria-label", "Delete"); b.onclick = () => del(r);
    li.append(d, b); out.push(li);

    // swipe left past 100px to delete
    let x0 = null, y0 = 0, dx = 0;
    const move = x => { for (const el of [d, b]) { el.style.transition = x ? "none" : ""; el.style.transform = x ? `translateX(${x}px)` : ""; } };
    li.addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; }, {passive: true});
    li.addEventListener("touchmove", ev => {
      if (x0 === null) return;
      dx = ev.touches[0].clientX - x0;
      if (dx < -10 && Math.abs(dx) > Math.abs(ev.touches[0].clientY - y0)) { li.classList.add("swiping"); move(dx); }
    }, {passive: true});
    const end = go => { move(0); li.classList.remove("swiping"); const hit = go && dx < -100; x0 = null; dx = 0; if (hit) del(r); };
    li.addEventListener("touchend", () => end(true));
    li.addEventListener("touchcancel", () => end(false));
  }
  if (!shown.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = filtered ? "Nothing matches your search." : "No entries this month yet. Tap + to add your first one.";
    out.push(li);
  }
  $("list").replaceChildren(...out);
}

// pull down at the top of the page to refresh
let py = null;
addEventListener("touchstart", e => { py = scrollY === 0 && S && !$("sheet").classList.contains("open") ? e.touches[0].clientY : null; }, {passive: true});
addEventListener("touchend", e => { if (py !== null && e.changedTouches[0].clientY - py > 90) spin(load); py = null; }, {passive: true});

// budget editor: inputs are built fresh on open so the 30s refresh never wipes what you're typing
$("bd").ontoggle = () => {
  if (!$("bd").open) return;
  $("bgrid").replaceChildren(...CATS.map(c => {
    const l = document.createElement("label"), s = document.createElement("span"), i = document.createElement("input");
    l.className = "bg"; s.textContent = c; i.type = "number"; i.inputMode = "decimal"; i.min = 1;
    i.placeholder = "No limit"; i.dataset.c = c; i.value = budgets[c] || "";
    l.append(s, i); return l;
  }));
};
$("bsave").onclick = () => spin(async () => {
  const ins = [...$("bgrid").querySelectorAll("input")];
  const set = ins.filter(i => +i.value > 0).map(i => ({category: i.dataset.c, amount: +i.value}));
  const clear = ins.filter(i => !(+i.value > 0)).map(i => i.dataset.c);
  try {
    if (set.length) await api("", {method: "POST", headers: {Prefer: "resolution=merge-duplicates,return=minimal"}, body: JSON.stringify(set)}, "budgets");
    if (clear.length) await api(`?category=in.(${clear.join(",")})`, {method: "DELETE"}, "budgets");
    $("bd").open = false; toast("Budgets saved ✓"); await load();
  } catch (e) { toast(errMsg(e)); }
});
$("fwho").replaceChildren(new Option("Everyone", ""), ...NAMES.map(n => new Option(n)));
$("fcat").replaceChildren(new Option("All categories", ""), ...CATS.map(c => new Option(c)));
$("q").oninput = $("fwho").onchange = $("fcat").onchange = render;

$("csv").onclick = e => {
  e.preventDefault();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "date,type,amount,who,category,note\n" + rows.map(r => [r.date, r.type, r.amount, r.who, r.category, r.note].map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = `gharkharch-${$("month").value}.csv`; a.click();
};

// share the month's summary through the phone's share sheet (WhatsApp link if the browser has none)
$("share").onclick = async e => {
  e.preventDefault();
  if (!summary) return;
  const s = summary, top = Object.entries(s.by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, v]) => `${c} ₹${fmt(v)}`).join(", ");
  const text = `Gharkharch · ${new Date(s.m + "-01T00:00").toLocaleDateString("en-IN", {month: "long", year: "numeric"})}\n` +
    `Income ₹${fmt(s.inc)}` + (s.carry ? ` (+ ₹${fmt(s.carry)} carried)` : "") + `\nSpent ₹${fmt(s.exp)}\nLeft ₹${fmt(s.bal)}` +
    (top ? `\nTop: ${top}` : "") + (s.exp ? `\nSpent by ${Object.entries(s.who).map(([n, v]) => `${n} ₹${fmt(v)}`).join(", ")}` : "");
  try { navigator.share ? await navigator.share({text}) : open("https://wa.me/?text=" + encodeURIComponent(text)); } catch (e) {} // cancel = AbortError
};

// daily reminder: a repeating calendar event with an alert; the phone's Calendar does the notifying
$("remind").onclick = e => {
  e.preventDefault();
  const stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, ""), hh = String(REMIND_HOUR).padStart(2, "0");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//gharkharch//EN", "BEGIN:VEVENT", "UID:gharkharch-daily@gharkharch",
    `DTSTAMP:${stamp}`, `DTSTART:${today.replaceAll("-", "")}T${hh}0000`, "DURATION:PT15M", "RRULE:FREQ=DAILY",
    "SUMMARY:Log today's expenses (Gharkharch)", `DESCRIPTION:${location.href.split("#")[0]}`,
    "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:Log today's expenses", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type: "text/calendar"}));
  a.download = "gharkharch-reminder.ics"; a.click();
  toast(`Open the file to add a daily ${REMIND_HOUR % 12 || 12}${REMIND_HOUR < 12 ? "am" : "pm"} reminder`);
};

if (S) { show(true); spin(load); } else show(false);
setInterval(() => S && !editId && load(), 30000); // pick up the other person's entries
</script>
</body>
</html>
