name: Keep Supabase alive

# Free Supabase projects pause after 7 days without activity.
# This pings the REST API twice a week (Mon + Thu) so the project never pauses.
on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 \
            "https://drcenfbvcenegefozzsi.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_nM8K1MbZxXaU5r3lgFo98A_VQsTImE3"
